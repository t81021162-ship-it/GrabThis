set timeout=5
set default=0

menuentry "🐄 MOoOS Kernel - Boot Multiboot Kernel" {
    multiboot /boot/moos_kernel.bin
}

menuentry "🐄 MOoOS Kernel + Shell Module" {
    multiboot /boot/moos_kernel.bin
    module /bin/moos-shell MOoOS Shell
}

