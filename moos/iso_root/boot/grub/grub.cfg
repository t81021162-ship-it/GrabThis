set timeout=10
set default=0

menuentry "MOoOS Kernel - Boot" {
    multiboot /boot/moos_kernel.bin
}

menuentry "MOoOS Kernel + Shell" {
    multiboot /boot/moos_kernel.bin
    module /bin/moos-shell MOoOS Shell
}

menuentry "MOO THE VIRUS - Antivirus Scanner" {
    echo "Starting MOO THE VIRUS..."
    echo "Location: /bin/moo-scanner"
}

menuentry "MOoOS Dashboard - System Monitor" {
    echo "Starting MOoOS Dashboard..."
    echo "Location: /bin/moos-dashboard"
}

menuentry "Documentation & Source" {
    echo "MOoOS v0.1.0 Documentation"
    echo ""
    echo "Files included:"
    echo "  /QUICKSTART.txt - Getting started"
    echo "  /README.txt - Complete guide"
    echo "  /docs/README.md - Full docs"
    echo "  /docs/DESIGN.md - Architecture"
    echo ""
    echo "To continue, reboot and select another option."
}
